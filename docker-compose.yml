services:
  ops-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: ops-postgres
    restart: unless-stopped
    ports:
      - "${OPS_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ops_db
    volumes:
      - ops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ops-network

  ops-mongo:
    image: docker.io/library/mongo:7-jammy
    container_name: ops-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ops_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ops-network

  ops-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ops-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@ops-postgres:5432/ops_db?schema=public
      - MONGO_URI=mongodb://ops-mongo:27017/ops_audit_db
    depends_on:
      ops-postgres:
        condition: service_healthy
      ops-mongo:
        condition: service_healthy
    networks:
      - ops-network

  ops-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - ops-backend
    networks:
      - ops-network

networks:
  ops-network:
    driver: bridge
    name: ops-network

volumes:
  ops_postgres_data:
    driver: local
  ops_mongo_data:
    driver: local
